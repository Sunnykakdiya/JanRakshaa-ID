name: janraksha_id
description: JanRaksha ID - Emergency Medical Identity App with AI/ML
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.3.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    # Firebase
    firebase_core: ^3.6.0
    firebase_auth: ^5.3.1
    cloud_firestore: ^5.4.4

    # State Management
    provider: ^6.1.2

    # QR Code
    qr_flutter: ^4.1.0
    mobile_scanner: ^5.2.3

    # AI — Phase 3
    google_generative_ai: ^0.4.6
    shared_preferences: ^2.3.2

    # OCR — Phase 4 (on-device, FREE, no API calls)
    google_mlkit_text_recognition: ^0.13.0
    image_picker: ^1.1.2

    # Utils
    url_launcher: ^6.3.1

    # UI
    google_fonts: ^6.2.1
    cupertino_icons: ^1.0.8
    fl_chart: ^1.2.0
    intl: ^0.19.0
    speech_to_text: ^7.5.0
    geolocator: ^14.1.1
    google_mlkit_face_detection: ^0.11.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^4.0.0

flutter:
    uses-material-design: true


