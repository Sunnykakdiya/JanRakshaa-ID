name: janraksha_id
description: JanRaksha ID - Emergency Medical Identity App with AI/ML
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management
  provider: ^6.1.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ── Phase 3: Gemini AI ───────────────────────────────────
  google_generative_ai: ^0.4.6

  # Utils
  url_launcher: ^6.3.1

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true